<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="iconog.png">
    <title>Lista de compras</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="app-container">
        <header class="top-header">
            <a href="index.html" class="btn-back">‹ Volver</a>
            <h2>🛍️ Lista de compras</h2>
        </header>

        <div class="config-card">
            <h3 class="form-title-center">Registrar producto a comprar</h3>

            <form id="form-compras">
                <div class="form-group">
                    <label for="input-producto">Producto:</label>
                    <div class="input-voice-group">
                        <input type="text" id="input-producto" placeholder="Ej: Leche... | Leche alta prioridad..."
                            required autocomplete="off">
                        <button type="button" id="btn-voice" class="btn-mic" title="Dictar por voz">🎙️</button>
                    </div>
                    <small id="voice-status" class="voice-status-text"></small>
                </div>

                <div class="form-group">
                    <label for="select-prioridad">Prioridad:</label>
                    <select id="select-prioridad">
                        <option value="ninguna" selected>⚪ Sin prioridad</option>
                        <option value="alta">🔴 Alta prioridad</option>
                        <option value="media">🟡 Prioridad media</option>
                        <option value="baja">🟢 Baja prioridad</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">Guardar en la lista</button>
            </form>
        </div>

        <div class="sort-controls">
            <span>Filtrar por:</span>
            <button type="button" class="btn-sort active" id="sort-priority">🔥 Prioridad</button>
            <button type="button" class="btn-sort" id="sort-alpha">🔤 A - Z</button>
        </div>

        <div id="lista-compras" class="shopping-list-container"></div>
    </div>

    <script src="compras.js"></script>
</body>
</html>
